<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>🗂️ Administración de Categorías</h2>
    <a routerLink="/categories/new" class="btn btn-dark">+ Nueva Categoría</a>
  </div>

  @if (isLoading()) {
    <p>Cargando...</p>
  } @else {
    <div class="table-responsive shadow-sm rounded">
      <table class="table table-bordered table-hover mb-0 align-middle">
        <thead class="table-dark">
          <tr>
            <th>Nombre de la Categoría</th>
            <th class="text-end">Acciones</th>
          </tr>
        </thead>
        <tbody>
          @for (cat of categories(); track cat._id) {
            <tr>
              <td class="fw-bold fs-6">{{ cat.name }}</td>
              <td class="text-end">
                <a [routerLink]="['/categories/edit', cat._id]" class="btn btn-sm btn-outline-primary me-2">✏️ Editar</a>
                <button (click)="deleteCategory(cat._id)" class="btn btn-sm btn-outline-danger">🗑️ Eliminar</button>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  }
</div>
