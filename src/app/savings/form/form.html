<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header bg-success text-white">
          <h4 class="mb-0">{{ isEditMode() ? '✏️ Editar Meta de Ahorro' : '➕ Nueva Meta de Ahorro' }}</h4>
        </div>
        <div class="card-body">
          
          @if (errorMessage()) {
            <div class="alert alert-danger">{{ errorMessage() }}</div>
          }

          <form [formGroup]="savingsForm" (ngSubmit)="onSubmit()">
            
            <div class="mb-3">
              <label class="form-label">Nombre de la meta</label>
              <input type="text" class="form-control" formControlName="name" placeholder="Ej: Viaje a Europa, Moto nueva...">
              @if (savingsForm.get('name')?.invalid && savingsForm.get('name')?.touched) {
                <div class="text-danger small">El nombre es requerido (mínimo 3 letras)</div>
              }
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Monto Objetivo ($)</label>
                <input type="number" class="form-control" formControlName="target_amount" placeholder="Ej: 5000">
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Monto Ahorrado Hasta Hoy ($)</label>
                <input type="number" class="form-control" formControlName="current_amount" placeholder="Ej: 500">
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label">Fecha Límite (Opcional)</label>
              <input type="date" class="form-control" formControlName="deadline">
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a routerLink="/savings" class="btn btn-outline-secondary">Cancelar</a>
              <button type="submit" class="btn btn-success" [disabled]="savingsForm.invalid || isLoading()">
                {{ isLoading() ? 'Guardando...' : 'Guardar Meta' }}
              </button>
            </div>
            
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
