<div class="container mt-4">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-header bg-danger text-white">
          <h4 class="mb-0">{{ isEditMode() ? '✏️ Editar Gasto' : '➕ Nuevo Gasto' }}</h4>
        </div>
        <div class="card-body">
          
          @if (errorMessage()) {
            <div class="alert alert-danger">{{ errorMessage() }}</div>
          }

          <form [formGroup]="expenseForm" (ngSubmit)="onSubmit()">
            
            <div class="mb-3">
              <label class="form-label">Monto del Gasto ($)</label>
              <input type="number" class="form-control" formControlName="amount" placeholder="Ej: 50.00">
            </div>

            <div class="mb-3">
              <label class="form-label">Descripción (Opcional)</label>
              <input type="text" class="form-control" formControlName="description" placeholder="Ej: Mercado semanal">
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Fecha</label>
                <input type="date" class="form-control" formControlName="date">
              </div>

              <div class="col-md-6 mb-3">
                <label class="form-label">Categoría</label>
                <select class="form-select" formControlName="category_id">
                  <option value="" disabled selected>Selecciona categoría</option>
                  <!-- Iteramos sobre las categorías que trajimos del backend -->
                  @for (cat of categories(); track cat._id) {
                    <option [value]="cat._id">{{ cat.name }}</option>
                  }
                </select>
              </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
              <a routerLink="/expenses" class="btn btn-outline-secondary">Cancelar</a>
              <button type="submit" class="btn btn-danger" [disabled]="expenseForm.invalid || isLoading()">
                {{ isLoading() ? 'Guardando...' : 'Guardar Gasto' }}
              </button>
            </div>
            
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
