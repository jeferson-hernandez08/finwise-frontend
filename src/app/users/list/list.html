<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h2>👥 Gestión de Usuarios (Admin)</h2>
    <a routerLink="/users/new" class="btn btn-dark">+ Nuevo Usuario</a>
  </div>

  @if (!isLoading()) {
    <table class="table table-hover align-middle shadow-sm">
      <thead class="table-dark">
        <tr>
          <th>Nombre Completo</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Proveedor</th>
          <th class="text-end">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (user of users(); track user._id) {
          <tr>
            <td class="fw-bold">{{ user.full_name }}</td>
            <td>{{ user.email }}</td>
            <td>
              <!-- Como hicimos populate, role_id ahora es un objeto -->
              <span class="badge" [class.bg-danger]="user.role_id?.name === 'admin'" [class.bg-primary]="user.role_id?.name !== 'admin'">
                {{ user.role_id?.name | uppercase }}
              </span>
            </td>
            <td>
              @if (user.google_id) {
                <span class="badge bg-secondary">Google</span>
              } @else {
                <span class="badge bg-info text-dark">Local</span>
              }
            </td>
            <td class="text-end">
              <a [routerLink]="['/users/edit', user._id]" class="btn btn-sm btn-outline-primary me-2">✏️ Editar</a>
              <button (click)="deleteUser(user._id)" class="btn btn-sm btn-outline-danger">🗑️ Eliminar</button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  }
</div>
