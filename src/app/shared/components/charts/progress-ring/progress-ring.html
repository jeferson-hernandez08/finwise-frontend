<svg
  class="ring"
  viewBox="0 0 100 100"
  preserveAspectRatio="xMidYMid meet"
  [style.width.px]="size()"
  [style.height.px]="size()"
  role="img"
  [attr.aria-label]="ariaLabel()"
>
  <circle class="track" cx="50" cy="50" [attr.r]="radius" />

  @if (hasProgress()) {
    <circle
      class="value"
      cx="50"
      cy="50"
      [attr.r]="radius"
      [attr.stroke]="strokeColor()"
      [attr.stroke-dasharray]="dashArray()"
      transform="rotate(-90 50 50)"
    />
  }

  @if (label()) {
    <text class="percent" x="50" y="48">{{ percentText() }}</text>
    <text class="caption" x="50" y="62">{{ label() }}</text>
  } @else {
    <text class="percent" x="50" y="56">{{ percentText() }}</text>
  }
</svg>
